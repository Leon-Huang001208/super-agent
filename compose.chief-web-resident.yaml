name: super-agent-chief-web-resident-rwb

services:
  db:
    restart: unless-stopped
  paperclip:
    restart: unless-stopped
    environment:
      PAPERCLIP_PUBLIC_URL: http://localhost:8112
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: http://localhost:8112
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:8112
      SUPER_AGENT_CHIEF_WEB_REAL_DOCUMENT: "${SUPER_AGENT_CHIEF_WEB_REAL_DOCUMENT:?set the exact resident document}"
  gateway:
    restart: unless-stopped
    ports: !override [127.0.0.1:8112:3100]
